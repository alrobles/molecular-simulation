name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar sintaxis
        run: for f in js/*.js tests/*.js; do node --check "$f"; done

      - name: Pruebas de química y termodinámica
        run: npm test
